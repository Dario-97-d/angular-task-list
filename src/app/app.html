<div class="container">
  <h1>My Tasks</h1>

  <div class="add-row">
    <input
      [(ngModel)]="newTaskTitle"
      (keyup.enter)="onAddTask()"
      placeholder="What needs doing?"
    />
    <button (click)="onAddTask()">Add</button>
  </div>

  <div class="filters">
    <button (click)="taskService.filter.set('all')">All ({{ taskService.tasks().length }})</button>
    <button (click)="taskService.filter.set('active')">Active ({{ taskService.activeCount() }})</button>
    <button (click)="taskService.filter.set('completed')">Completed ({{ taskService.completedCount() }})</button>
  </div>

  <ul class="task-list">
    @for (task of taskService.filteredTasks(); track task._id) {
      <li [class.done]="task.done">
        <input
          type="checkbox"
          [checked]="task.done"
          (change)="taskService.toggleDone(task)"
        />
        <a [routerLink]="['/tasks', task._id]">{{ task.title }}</a>
        <button class="delete" (click)="taskService.deleteTask(task._id)">✕</button>
      </li>
    } @empty {
      <li class="empty">No tasks yet — add one above.</li>
    }
  </ul>

  @if (taskService.tasks().length > 0) {
    <div class="footer">
      <span>{{ taskService.tasks().length }} tasks</span>
      <button (click)="taskService.clearCompleted()">Clear completed</button>
    </div>
  }

  @if (taskService.error(); as error) {
    <div class="error">{{ error }}</div>
  }

  <router-outlet></router-outlet>
</div>
