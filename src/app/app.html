<div class="container">
  <h1>My Tasks</h1>

  <div class="add-row">
    <input
      [(ngModel)]="newTaskTitle"
      (keyup.enter)="onAddTask()"
      placeholder="What needs doing?"
    />
    <button (click)="onAddTask()">Add</button>
  </div>

  <ul class="task-list">
    @for (task of taskService.tasks(); track task.id) {
      <li [class.done]="task.done">
        <input
          type="checkbox"
          [checked]="task.done"
          (change)="taskService.toggleDone(task)"
        />
        <span>{{ task.title }}</span>
        <button class="delete" (click)="taskService.deleteTask(task.id)">✕</button>
      </li>
    } @empty {
      <li class="empty">No tasks yet — add one above.</li>
    }
  </ul>
</div>
